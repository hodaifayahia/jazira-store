<svg viewBox="0 0 240 280" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="brandGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00D4FF;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#00B3FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0088FF;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="brandGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0066FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0033CC;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- S letter (left flowing shape) -->
  <g id="s-letter">
    <path d="M 60 50 Q 50 60 55 75 Q 65 85 80 80 Q 90 75 85 65 Q 75 55 65 60 Q 55 65 60 75 Q 70 85 85 85 Q 100 85 100 70" fill="none" stroke="url(#brandGrad1)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- H letter (right structured shape) -->
  <g id="h-letter">
    <path d="M 130 40 L 130 130 M 170 40 L 170 130 M 130 80 L 170 80" fill="none" stroke="url(#brandGrad2)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Decorative network nodes -->
  <circle cx="55" cy="45" r="2.5" fill="#00D4FF" opacity="0.8"/>
  <circle cx="95" cy="65" r="2.5" fill="#0088FF" opacity="0.8"/>
  <circle cx="135" cy="35" r="2.5" fill="#0066FF" opacity="0.8"/>
  <circle cx="170" cy="55" r="2.5" fill="#0088FF" opacity="0.8"/>
  <circle cx="75" cy="95" r="2" fill="#0099FF" opacity="0.6"/>
  <circle cx="160" cy="120" r="2" fill="#0066FF" opacity="0.6"/>

  <!-- Subtle connection lines -->
  <line x1="55" y1="45" x2="95" y2="65" stroke="#00D4FF" stroke-width="1" opacity="0.4"/>
  <line x1="95" y1="65" x2="135" y2="35" stroke="#0088FF" stroke-width="1" opacity="0.4"/>
  <line x1="135" y1="35" x2="170" y2="55" stroke="#0066FF" stroke-width="1" opacity="0.4"/>
</svg>